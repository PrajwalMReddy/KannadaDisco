name: kannada_disco
description: An app to learn Kannada
publish_to: 'none'

# version: <versionName>+<versionCode>. The versionCode (after the +) must go
# up with every Play Store release. Keep appVersion in lib/element/side_bar.dart
# in sync with the versionName.
version: 1.2.0+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_local_notifications: ^23.0.4
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.0
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  timezone: ^0.11.2
  url_launcher: ^6.3.0
  youtube_player_flutter: ^11.0.0
  flutter_markdown_plus: ^1.0.12
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0

# Regenerate app icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  # The App Store rejects icons with transparency.
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - course/
    - assets/
    - res/reading/
    - res/vocab/
    - res/gram/
    - res/conv/
